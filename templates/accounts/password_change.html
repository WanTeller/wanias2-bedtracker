{% extends "accounts/_auth_base.html" %}
{% block heading %}Change password{% endblock %}
{% block body %}
<form method="post">
  {% csrf_token %}
  {% for field in form %}
  <div class="field">
    {{ field.label_tag }}{{ field }}
    {% if field.errors %}<div class="field-error">{{ field.errors|striptags }}</div>{% endif %}
  </div>
  {% endfor %}
  <button type="submit" class="btn primary">Change password</button>
</form>
<p class="auth-links"><a href="{% url 'board' %}">Back to the board</a></p>
{% endblock %}
